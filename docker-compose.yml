version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: nosql_evotrace_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nosql_evotrace
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: nosql_evotrace_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required for production deployment}
      - HOST=0.0.0.0
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=nosql_evotrace
      - ALLOW_MOCK_FALLBACK=false
      - REDACT_SENSITIVE_PROVENANCE=false
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local
